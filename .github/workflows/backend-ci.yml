name: Backend CI

on:
  pull_request:
    paths: ['backend/**', 'docs/api/**', '.github/workflows/backend-ci.yml']
  push:
    branches: [Backend-Database]
    paths: ['backend/**', 'docs/api/**', '.github/workflows/backend-ci.yml']

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      LANGUAGEPLATFORM_TEST_CONNECTION: Host=127.0.0.1;Port=5432;Database=language_platform_test;Username=lp_test;Password=${{ github.run_id }}
      LANGUAGEPLATFORM_OPENAPI_OUTPUT: ${{ github.workspace }}/TestResults/openapi.v1.json
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: lp_test
          POSTGRES_PASSWORD: ${{ github.run_id }}
          POSTGRES_DB: language_platform_test
        ports: ['127.0.0.1:5432:5432']
        options: >-
          --health-cmd "pg_isready -U lp_test -d language_platform_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
      - name: Diff and secret scan
        run: |
          git diff --check HEAD^ HEAD
          scanner="$RUNNER_TEMP/gitleaks"
          mkdir -p "$scanner"
          cd "$scanner"
          curl --fail --silent --show-error --location --max-time 60 -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          echo "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          cd "$GITHUB_WORKSPACE"
          "$scanner/gitleaks" git --redact=100 --log-opts="HEAD^..HEAD" .
          "$scanner/gitleaks" dir --redact=100 .
      - name: Restore and audit dependencies
        run: |
          mkdir -p TestResults
          dotnet restore backend/LanguagePlatform.slnx
          dotnet list backend/LanguagePlatform.slnx package --no-restore --vulnerable --include-transitive --format json --output-version 1 > TestResults/nuget-audit.json
          # NuGet omits frameworks for projects with no vulnerable packages.
          jq -es '
            def entries:
              if . == null then empty
              elif type == "array" then .[]
              else error("Malformed NuGet audit array")
              end;

            if length != 1 then error("Expected one NuGet audit report") else .[0] end
            | if .version != 1 or (.projects | type != "array" or length == 0) then
                error("Expected a NuGet audit v1 report with projects")
              elif [.problems | entries] | length > 0 then
                error("NuGet audit reported problems; see nuget-audit.json")
              else
                [.projects[].frameworks | entries
                  | (.topLevelPackages | entries), (.transitivePackages | entries)
                  | .vulnerabilities | entries]
                | length == 0
              end
          ' TestResults/nuget-audit.json
      - name: Build and test with PostgreSQL 18
        run: |
          dotnet build backend/LanguagePlatform.slnx --no-restore -m:1
          dotnet test backend/LanguagePlatform.slnx --no-build --no-restore -m:1 --logger trx --results-directory TestResults
          jq -e '.openapi and .paths and .components.securitySchemes.Bearer' "$LANGUAGEPLATFORM_OPENAPI_OUTPUT" >/dev/null
      - name: Check EF snapshot and export review SQL
        run: |
          dotnet tool install --tool-path "$RUNNER_TEMP/ef" dotnet-ef --version 10.0.14
          ef="$RUNNER_TEMP/ef/dotnet-ef"
          project=backend/src/LanguagePlatform.Infrastructure
          startup=backend/src/LanguagePlatform.Api
          "$ef" migrations has-pending-model-changes --no-build --project "$project" --startup-project "$startup"
          "$ef" migrations script --idempotent --no-build --project "$project" --startup-project "$startup" --output TestResults/migrations.sql
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: backend-verification
          path: TestResults/
          if-no-files-found: ignore
          retention-days: 7
